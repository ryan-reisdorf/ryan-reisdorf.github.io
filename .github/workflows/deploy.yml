name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once. `cancel-in-progress: false` lets an
# in-flight production deploy finish rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload artifact
        uses: withastro/action@v3
        with:
          # Reads the pinned pnpm version from package.json → packageManager.
          package-manager: pnpm
          node-version: 24

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
